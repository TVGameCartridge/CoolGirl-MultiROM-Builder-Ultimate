name: Build FCEUX CGEMU342 Native

on:
  push:
    branches: [cgemu342-native-build]
    paths:
      - '.github/workflows/build-fceux-cgemu342.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download exact FCEUX source a62b868
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/TASEmulators/fceux/archive/a62b868.zip' -OutFile 'fceux.zip'
          New-Item -ItemType Directory -Path 'fceux-src' | Out-Null
          Expand-Archive 'fceux.zip' -DestinationPath 'fceux-src' -Force
          $src = (Get-ChildItem 'fceux-src' -Directory | Select-Object -First 1).FullName
          if (-not $src) { throw 'FCEUX source directory not found' }
          "FCEUX_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Source: $src"

      - name: Patch classic Windows FCEUX with native CGEMU342 launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/fceux-cgemu342/patch_fceux.py "$env:FCEUX_SRC"

      - name: Build classic Windows x64 FCEUX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sln = Join-Path $env:FCEUX_SRC 'vc\vc14_fceux.sln'
          msbuild $sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }

      - name: Create portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null

          $exe = Join-Path $env:FCEUX_SRC 'vc\x64\Release\fceux64.exe'
          if (-not (Test-Path $exe)) { throw 'Built fceux64.exe not found' }
          Copy-Item $exe 'dist\fceux.exe' -Force

          $win = Join-Path $env:FCEUX_SRC 'src\drivers\win'
          foreach ($dll in @(
            (Join-Path $win '7z.dll'),
            (Join-Path $win '7z_64.dll'),
            (Join-Path $win 'lua\x64\lua51.dll'),
            (Join-Path $win 'lua\x64\lua5.1.dll')
          )) {
            if (Test-Path $dll) { Copy-Item $dll 'dist' -Force }
          }

          @'
          CGEMU342 native FCEUX build.
          Put multirom.nes next to fceux.exe and start fceux.exe.
          The launcher is compiled into FCEUX; no Lua script is used.
          Press R to return to the multirom menu.
          '@ | Set-Content 'dist\README.txt' -Encoding ASCII

          if (Get-ChildItem 'dist' -Recurse -Filter '*.lua') { throw 'Lua script unexpectedly present in package' }

      - name: Upload ready Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FCEUX-CGEMU342-Windows
          path: dist/**
          if-no-files-found: error
          retention-days: 14
