name: Build FCEUX 2.7.0 Mapper Test

on:
  push:
    branches: [fceux-mappers-test]
    paths:
      - '.github/workflows/build-fceux-mappers-test.yml'
      - 'tools/fceux-mappers-test/**'
      - 'tools/fceux-cgemu342/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-declarative
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-minizip
            mingw-w64-x86_64-libarchive

      - name: Download exact FCEUX 2.7.0 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/TASEmulators/fceux/archive/a62b868e9247c4aafd66f597cdfa8d2609704087.zip' -OutFile 'fceux.zip'
          New-Item -ItemType Directory -Path 'fceux-src' | Out-Null
          Expand-Archive 'fceux.zip' -DestinationPath 'fceux-src' -Force
          $src = (Get-ChildItem 'fceux-src' -Directory | Select-Object -First 1).FullName
          if (-not $src) { throw 'FCEUX source directory not found' }
          "FCEUX_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply MinGW portability and requested mapper patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/fceux-cgemu342/patch_fceux.py "$env:FCEUX_SRC"
          python tools/fceux-mappers-test/patch_fceux.py "$env:FCEUX_SRC"
          python tools/fceux-mappers-test/fix_jyasic_api.py "$env:FCEUX_SRC"

      - name: Qt5 tool compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compat = 'C:\msys64\mingw64\lib\qt5\bin'
          New-Item -ItemType Directory -Path $compat -Force | Out-Null
          foreach ($tool in @('qcollectiongenerator.exe','qhelpgenerator.exe')) {
            $srcTool = Join-Path 'C:\msys64\mingw64\bin' $tool
            if (Test-Path $srcTool) { Copy-Item $srcTool (Join-Path $compat $tool) -Force }
          }

      - name: Configure
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          SRC="$(cygpath -u "$FCEUX_SRC")"
          cmake -S "$SRC" -B fceux-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DQT6=0 \
            -DUSE_LIBAV=0 \
            -DGPROF_ENABLE=0 \
            -DASAN_ENABLE=0

      - name: Build
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cmake --build fceux-build --parallel 2

      - name: Create portable Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem 'fceux-build' -Recurse -File | Where-Object { $_.Name -in @('fceux.exe','qfceux.exe') } | Select-Object -First 1
          if (-not $exe) { throw 'Built FCEUX executable not found' }

          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          $target = (Resolve-Path 'dist').Path + '\fceux-2.7.0-mappers-test.exe'
          Copy-Item $exe.FullName $target -Force

          $windeployqt = 'C:\msys64\mingw64\bin\windeployqt.exe'
          if (Test-Path $windeployqt) { & $windeployqt --release --no-translations $target }

          $objdump = 'C:\msys64\mingw64\bin\objdump.exe'
          $mingwBin = 'C:\msys64\mingw64\bin'
          $queue = [System.Collections.Queue]::new()
          $seen = @{}
          $queue.Enqueue($target)
          while ($queue.Count -gt 0) {
            $bin = $queue.Dequeue()
            $deps = & $objdump -p $bin 2>$null | Select-String 'DLL Name:' | ForEach-Object { ($_ -split 'DLL Name:\s*')[1].Trim() }
            foreach ($dll in $deps) {
              $key = $dll.ToLowerInvariant()
              if ($seen.ContainsKey($key)) { continue }
              $seen[$key] = $true
              $srcDll = Join-Path $mingwBin $dll
              if (Test-Path $srcDll) {
                $dstDll = Join-Path (Resolve-Path 'dist').Path $dll
                if (-not (Test-Path $dstDll)) {
                  Copy-Item $srcDll $dstDll -Force
                  $queue.Enqueue($dstDll)
                }
              }
            }
          }

          'FCEUX 2.7.0 mapper test build: 45, 264, 287, 315, 344, 358, 393, 395, 540' | Set-Content 'dist\README.txt' -Encoding UTF8

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: FCEUX-2.7.0-Mappers-Test-Windows
          path: dist/**
          if-no-files-found: error
          retention-days: 14
